name: CI

on:
  push:
    branches: [main]
    paths: ['src/**', 'pom.xml', 'Dockerfile', '.dockerignore', '.github/workflows/**']
  pull_request:
    branches: [main]
    paths: ['src/**', 'pom.xml', 'Dockerfile', '.dockerignore', '.github/workflows/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (${{ matrix.os }}, Java ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: [17, 21]
        exclude:
          - os: windows-latest
            java: 17
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build & run tests
        run: mvn -B verify

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.os }}-java${{ matrix.java }}
          path: target/surefire-reports/

  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for Sonar blame info

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Tests are enforced by the build job; here we only need the reports for coverage
      - name: Build, test & analyze
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dmaven.test.failure.ignore=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker:
    name: Docker Build & Export
    runs-on: ubuntu-latest
    needs: [build, sonar]   # only package code that passed tests and analysis
    env:
      IMAGE_NAME: michi131203/ci-cd-uebung
    steps:
      - uses: actions/checkout@v4

      # On PRs github.sha is a temporary merge commit -> use the PR head commit instead
      - name: Compute short SHA
        run: |
          FULL_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "SHORT_SHA=${FULL_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Single-arch build with load: true so the image is available to docker save
      - name: Build image ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image as tar
        run: docker save -o docker-image-${SHORT_SHA}.tar ${IMAGE_NAME}:${SHORT_SHA}

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ env.SHORT_SHA }}
          path: docker-image-${{ env.SHORT_SHA }}.tar
          retention-days: 7
